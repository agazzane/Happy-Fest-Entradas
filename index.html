<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Fest - Puerta</title>
<style>
  :root{--navy:#1E2A5A;--gold:#FFD166;--ink:#0f1535;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.14)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:#fff;
       background:radial-gradient(circle at 50% -10%,#2c3c83 0%,var(--navy) 40%,var(--ink) 100%) fixed}
  main{max-width:480px;margin:0 auto;padding:18px 14px 28px}
  header{text-align:center;margin:10px 0 18px}
  .logo{font-size:2.6rem;line-height:1}
  .logo img{max-width:62%;max-height:150px;object-fit:contain;border-radius:14px;display:inline-block}
  header h1{font-size:1.7rem;margin:6px 0 0;letter-spacing:.5px;color:var(--gold)}
  header p{margin:2px 0 0;opacity:.75;font-size:.95rem;letter-spacing:2px;text-transform:uppercase}
  input,select,button{font-size:1.05rem;padding:13px;border-radius:12px;border:0;width:100%;margin-top:8px;font-family:inherit}
  input,select{background:#fff;color:#111}
  button{background:var(--gold);color:var(--navy);font-weight:700;cursor:pointer;transition:transform .12s ease,filter .12s ease}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.6}
  button.sec{background:rgba(255,255,255,.14);color:#fff}
  .card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:20px 16px;margin-top:26px;
        box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .card label{display:block;font-size:.85rem;opacity:.8;margin-bottom:2px}
  .card input{text-align:center;font-size:1.3rem;letter-spacing:4px}
  #usr,#fiesta{font-size:1.15rem;text-align-last:center}
  .err{color:#ffb4b4;text-align:center;min-height:1.3em;margin-top:8px;font-size:.95rem}

  /* ---- Menú de inicio ---- */
  #home{margin-top:6px}
  #homeTxt{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 20px}
  #homeTxt span{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem;font-weight:600;color:var(--gold)}
  .hcard{display:flex;align-items:center;gap:16px;text-align:left;margin-top:14px;padding:20px 18px;border-radius:20px;
         background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));color:#fff;
         border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.3)}
  .hcard:active{background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.08))}
  .hico{flex:none;width:64px;height:64px;border-radius:18px;background:var(--gold);color:var(--navy);display:grid;place-items:center;
        box-shadow:0 6px 16px rgba(255,209,102,.3)}
  .hico svg{width:34px;height:34px}
  .htxt{flex:1;min-width:0}
  .htxt b{display:block;font-size:1.3rem;line-height:1.2}
  .htxt small{display:block;font-size:.9rem;font-weight:400;opacity:.75;margin-top:4px}
  .hchev{flex:none;width:22px;height:22px;opacity:.55}
  #btnSalir2{background:transparent;color:#fff;opacity:.7;font-weight:600;margin-top:26px;border:1px solid var(--line)}

  /* ---- Barra superior dentro de cada modo ---- */
  #bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  #btnHome{flex:none;width:46px;height:46px;padding:0;margin:0;display:grid;place-items:center;border-radius:14px;background:var(--gold);color:var(--navy)}
  #btnHome svg{width:24px;height:24px}
  #barTxt{flex:1;min-width:0;text-align:left;line-height:1.2}
  #barTxt b{display:block;color:var(--gold);font-size:1.1rem}
  #barTxt small{display:block;opacity:.7;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #reader{width:100%;border-radius:14px;overflow:hidden;margin-top:10px;min-height:120px;background:#000}
  #rw{position:relative;overflow:hidden;border-radius:14px;margin-top:10px}
  #rw #reader{margin-top:0}
  /* Modo DNI: ventana baja y ancha (se recorta la imagen al centro) con una guía para el PDF417 */
  #guide{display:none;position:absolute;left:50%;top:50%;width:90%;height:100px;transform:translate(-50%,-50%);
         border:3px solid var(--gold);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none;z-index:2}
  #rw.dni #guide{display:block}
  #rw.dni #reader{height:190px;min-height:0;position:relative}
  #rw.dni #reader video{position:absolute!important;left:0;top:50%;width:100%!important;height:auto!important;transform:translateY(-50%)}

  /* Cartel de resultado: tapa toda la pantalla y hay que cerrarlo para seguir escaneando */
  #ov{position:fixed;inset:0;z-index:50;background:rgba(5,8,25,.82);display:flex;align-items:center;justify-content:center;padding:16px}
  #ov.hide{display:none}
  #res{width:100%;max-width:440px;padding:28px 18px 20px;border-radius:20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  #res b{display:block;font-size:1.7rem;margin-bottom:8px}
  #res .nom{font-size:2.2rem;font-weight:700;line-height:1.15;margin:4px 0 6px;word-break:break-word}
  #res small{font-size:1rem}
  .ok{background:#16a34a}.warn{background:#d97706}.bad{background:#dc2626}
  .info{background:#1E2A5A;border:2px solid var(--gold)}
  #res .dato{font-size:1.3rem;margin-top:2px}
  #res select{margin-top:16px;font-size:1.15rem;text-align-last:center}
  #res input{margin-top:14px;font-size:1.15rem;text-align:center;letter-spacing:1px}
  .acts{display:flex;gap:8px;margin-top:20px}.acts button{margin:0}
  #btnEntrar{flex:2;background:#fff;color:#15803d;font-size:1.25rem;padding:16px}
  #btnCancel{flex:1;background:rgba(0,0,0,.25);color:#fff}
  #btnCerrar{background:#fff;color:var(--navy);font-size:1.25rem;padding:16px;margin-top:20px}

  /* Cartel "cargando": spinner + texto mientras se consulta la planilla */
  .spin{width:60px;height:60px;margin:6px auto 18px;border:6px solid rgba(255,255,255,.22);border-top-color:var(--gold);
        border-radius:50%;animation:girar .8s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
  #res .cod{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;color:var(--gold);margin:2px 0 10px}
  #res .lento{display:block;opacity:.8;min-height:1.3em}

  footer{text-align:center;opacity:.45;font-size:.75rem;margin-top:22px}
  .hide{display:none!important}
  .fade{animation:entra .28s ease}
  @keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade,.spin{animation-duration:.01s}button{transition:none}}
</style>
</head>
<body>
<main>
  <header id="hdr">
    <div class="logo"><img src="img/logo.jpg" alt="Happy Fest" onerror="this.replaceWith(document.createTextNode('🎉'))"></div>
    <h1>Happy Fest</h1>
    <p>Control de ingreso</p>
  </header>

  <section id="login" class="card">
    <label for="fiesta">Fiesta</label>
    <select id="fiesta"><option value="">Elegí la fiesta</option><option>Fiesta 1</option><option>Fiesta 2</option></select>
    <label for="usr" style="margin-top:12px">Usuario</label>
    <select id="usr"><option value="">Cargando usuarios…</option></select>
    <label for="pin" style="margin-top:12px">Contraseña</label>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••" autocomplete="current-password">
    <div id="loginErr" class="err"></div>
    <button id="btnLogin">Ingresar</button>
  </section>

  <!-- Menú de inicio: se ve después del login y al tocar la casita -->
  <div id="home" class="hide">
    <div id="homeTxt"></div>
    <button id="btnHomeQr" class="hcard">
      <span class="hico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="7" y="7" width="4" height="4" rx=".5"/><rect x="13" y="7" width="4" height="4" rx=".5"/><rect x="7" y="13" width="4" height="4" rx=".5"/><path d="M13 13h1.5M16.5 13H17M13 16.5V17M16.5 15v2"/></svg>
      </span>
      <span class="htxt"><b>Ingreso con QR</b><small>Escanear entradas</small></span>
      <svg class="hchev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <button id="btnHomeDni" class="hcard">
      <span class="hico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.6-1.6 1.7-2.4 3-2.4s2.4.8 3 2.4M14 10h4.5M14 13.5h3"/></svg>
      </span>
      <span class="htxt"><b>Venta en puerta</b><small>Escanear DNI y cobrar</small></span>
      <svg class="hchev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <button id="btnSalir2">Cerrar sesión</button>
  </div>

  <div id="app" class="hide">
    <div id="bar">
      <button id="btnHome" class="sec" aria-label="Volver al menú" title="Volver al menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1H10v-5.5h4v5.5h3.5a1 1 0 0 0 1-1V10"/></svg>
      </button>
      <span id="barTxt"></span>
    </div>
    <div id="rw"><div id="reader"></div><div id="guide"></div></div>

    <div id="boxQr">
      <input id="codigo" placeholder="Código manual (si el QR no lee)" autocapitalize="characters">
      <button id="btnCodigo" class="sec">Verificar código</button>
    </div>

    <div id="boxDni" class="hide">
      <input id="nombre" placeholder="Nombre y apellido (obligatorio)" autocomplete="off">
      <input id="dni" inputmode="numeric" placeholder="DNI">
      <input id="telefono" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Teléfono (solo números)">
      <select id="medio">
        <option value="">Medio de pago (obligatorio)</option>
        <option value="Efectivo">Efectivo</option>
        <option value="MP Sucovi">MP Sucovi</option>
      </select>
      <button id="btnVenta">Registrar venta e ingreso</button>
    </div>
  </div>

  <footer id="ver"></footer>
</main>

<!-- Cartel de resultado (se cierra solo con el botón) -->
<div id="ov" class="hide"><div id="res"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const VERSION = 'V2.13';
const API = 'https://script.google.com/macros/s/AKfycbzMpPl3zmXfQaGcZ1IcDG9wnPFv2LqhG8iqaqoqRgOzMpZf4h3qrcD73M2ElsGLJgKM/exec';
const $ = id => document.getElementById(id);
$('ver').textContent = 'Happy Fest · ' + VERSION;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// busy = true mientras hay un cartel abierto o una consulta en curso: no se acepta ningún escaneo nuevo.
let USR = '', PIN = '', FIESTA = '', busy = false, scanner = null, modo = 'qr', pendiente = null, lentoT = null;
const TAG = () => VERSION + ' · …' + API.slice(-12);

// OJO: el parámetro del código se llama "x" (con "c" Google rechaza el pedido).
async function call(p) {
  const r = await fetch(API + '?' + new URLSearchParams({ ...p, usr: USR, pin: PIN, fiesta: FIESTA }));
  const t = await r.text();
  try { return JSON.parse(t); }
  catch (e) {
    throw new Error('respuesta no válida, HTTP ' + r.status + ': ' + t.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80));
  }
}

const MSG = {
  VALIDA:       ['ok',   'ENTRADA VÁLIDA'],
  INGRESO_OK:   ['ok',   'INGRESO REGISTRADO'],
  YA_INGRESO:   ['warn', 'YA INGRESÓ'],
  NO_EXISTE:    ['bad',  'NO EXISTE O NO ESTÁ PAGADA'],
  VENTA_OK:     ['ok',   'VENTA REGISTRADA - PUEDE INGRESAR'],
  DNI_REPETIDO: ['warn', 'ESTE DNI YA FUE REGISTRADO'],
  OTRA_FIESTA:  ['bad',  'ENTRADA DE OTRA FIESTA']
};

// ---- Sonido de confirmación (ingreso o venta exitosa) ----
// Cambiá el número para elegir el sonido: 1 Ding · 2 Doble bip · 3 Acorde · 4 Caja registradora · 5 Campanita
const SONIDO = 4;
let AC = null;
function audio() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
  return AC;
}
function tono(f, t0, dur, tipo, vol) {
  const t = AC.currentTime + t0, o = AC.createOscillator(), g = AC.createGain();
  o.type = tipo || 'sine';
  o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const SONIDOS = {
  1: () => { tono(880, 0, 0.5, 'sine', 0.35); tono(1760, 0, 0.3, 'sine', 0.08); },
  2: () => { tono(660, 0, 0.12, 'square', 0.15); tono(990, 0.14, 0.22, 'square', 0.15); },
  3: () => { [523.25, 659.25, 783.99].forEach((f, i) => tono(f, i * 0.09, 0.4, 'triangle', 0.28)); },
  4: () => { tono(1318.5, 0, 0.25, 'triangle', 0.28); tono(1760, 0.12, 0.55, 'triangle', 0.28); },
  5: () => { tono(1568, 0, 0.9, 'sine', 0.22); tono(2349, 0, 0.6, 'sine', 0.1); tono(3136, 0, 0.4, 'sine', 0.05); }
};
function sonarOk() { if (!audio()) return; try { SONIDOS[SONIDO](); } catch (e) {} }
// Bip cortito de "ya leí el código" (distinto del sonido de ingreso OK)
function sonarLeido() { if (!audio()) return; try { tono(1000, 0, 0.07, 'sine', 0.12); } catch (e) {} }

// Cartel de "cargando": se abre apenas se lee el código y se reemplaza cuando llega la respuesta.
function cargando(titulo, detalle) {
  busy = true;
  clearTimeout(lentoT);
  $('ov').classList.remove('hide');
  const el = $('res');
  el.className = 'info';
  el.innerHTML = '<div class="spin"></div><b>' + esc(titulo) + '</b>' +
    (detalle ? '<div class="dato cod">' + esc(detalle) + '</div>' : '') +
    '<small class="lento" id="lento">Un momento…</small>';
  // Si tarda mucho, avisa que sigue trabajando (conexión lenta)
  lentoT = setTimeout(() => {
    const s = $('lento');
    if (s) s.textContent = 'Sigue buscando… la conexión está lenta';
  }, 8000);
}

// Muestra el cartel. Queda abierto hasta que la persona toque un botón.
function show(r) {
  busy = true;
  clearTimeout(lentoT);
  const el = $('res');
  $('ov').classList.remove('hide');
  let cls, html;
  if (!r.ok) {
    cls = 'bad';
    html = '<b>Error</b>' + (r.html || esc(r.error));
  } else {
    let txt;
    [cls, txt] = MSG[r.estado] || ['bad', 'RESPUESTA INESPERADA: ' + esc(JSON.stringify(r))];
    html = '<b>' + txt + '</b>' + (r.nombre ? '<div class="nom">' + esc(r.nombre) + '</div>' : '') +
      (r.estado === 'OTRA_FIESTA' ? '<div class="dato">Es de ' + esc(r.fiesta) + '</div>' : '') +
      (r.familia ? '<small>Invita: ' + esc(r.familia) + '</small>' : '') +
      (r.hora ? '<br><small>Hora de ingreso: ' + esc(r.hora) + '</small>' : '');
  }
  el.className = cls;
  if (r.ok && r.estado === 'VALIDA' && pendiente) {
    el.innerHTML = html + '<div class="acts"><button id="btnEntrar">DAR INGRESO</button><button id="btnCancel">Cancelar</button></div>';
    $('btnEntrar').onclick = entrar;
    $('btnCancel').onclick = cerrar;
  } else {
    el.innerHTML = html + '<button id="btnCerrar">Aceptar</button>';
    $('btnCerrar').onclick = cerrar;
  }
  navigator.vibrate && navigator.vibrate(cls === 'ok' ? 100 : [200, 100, 200]);
  if (r.ok && (r.estado === 'INGRESO_OK' || r.estado === 'VENTA_OK')) sonarOk();
}

// Cierra el cartel y vuelve a habilitar el escaneo.
function cerrar() {
  pendiente = null;
  clearTimeout(lentoT);
  bloqDni.hasta = Date.now() + 4000;
  $('ov').classList.add('hide');
  $('res').innerHTML = '';
  // pequeña pausa para que no relea el mismo código que sigue frente a la cámara
  setTimeout(() => busy = false, 800);
}

// ---- Venta en puerta con DNI escaneado: pantalla de confirmación ----
const MEDIOS = ['Efectivo', 'MP Sucovi'];
let bloqDni = { dni: '', hasta: 0 }; // evita releer enseguida el mismo DNI que sigue frente a la cámara
function confirmarVenta(d) {
  busy = true;
  bloqDni.dni = d.dni;
  const nombreCompleto = (d.nombre + ' ' + d.apellido).trim(); // nombre y apellido van juntos en la columna Nombre
  const el = $('res');
  $('ov').classList.remove('hide');
  el.className = 'info';
  el.innerHTML = '<b>VENTA EN PUERTA</b><small>' + esc(FIESTA) + '</small><div class="nom">' + esc(nombreCompleto) + '</div>' +
    '<div class="dato">DNI: ' + (d.dni ? esc(d.dni) : '—') + '</div>' +
    '<input id="telV" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Teléfono (solo números)">' +
    '<select id="medioV"><option value="">Medio de pago (obligatorio)</option>' +
    MEDIOS.map(m => '<option value="' + esc(m) + '">' + esc(m) + '</option>').join('') + '</select>' +
    '<div id="vErr" class="err"></div>' +
    '<div class="acts"><button id="btnEntrar">Aceptar</button><button id="btnCancel">Cancelar</button></div>';
  $('medioV').addEventListener('change', () => { $('vErr').textContent = ''; });
  $('telV').addEventListener('input', () => { $('telV').value = $('telV').value.replace(/\D/g, ''); });
  $('btnCancel').onclick = cerrar;
  $('btnEntrar').onclick = async () => {
    const medio = $('medioV').value;
    if (!medio) { $('vErr').textContent = 'Elegí el medio de pago'; return; }
    // IMPORTANTE: leer el teléfono ANTES de cargando(), porque cargando() reemplaza
    // el contenido del cartel y destruye los campos (telV, medioV).
    const telefono = $('telV').value.replace(/\D/g, '');
    audio();
    cargando('Registrando venta…', nombreCompleto);
    await seguro(() => call({ a: 'venta', nombre: nombreCompleto, apellido: '', dni: d.dni, telefono, medio }));
  };
}

async function seguro(fn) {
  try { const r = await fn(); show(r); return r; }
  catch (e) {
    show({ ok: false, html: 'No se pudo consultar (' + esc(e && e.message ? e.message : e) + ')<br><small>' + esc(TAG()) + '<br>Si persiste, usá el Plan B (planilla).</small>' });
    return null;
  }
}

async function verificar(code) {
  if (busy || !code) return;
  code = code.trim();
  pendiente = null;
  // Feedback inmediato: ya leyó el código y está buscando en la planilla
  cargando('Verificando entrada…', code);
  navigator.vibrate && navigator.vibrate(60);
  sonarLeido();
  // Primero solo consulta: NO marca el ingreso. Si es válida, el cartel trae DAR INGRESO / Cancelar.
  await seguro(async () => {
    const r = await call({ a: 'check', x: code });
    if (r && r.ok && r.estado === 'VALIDA') pendiente = code;
    return r;
  });
}

async function entrar() {
  audio();
  const code = pendiente;
  cargando('Registrando ingreso…', code);
  await seguro(() => call({ a: 'ingresar', x: code }));
  pendiente = null; // el cartel nuevo (con datos del ingreso) queda hasta que toquen Aceptar
}

/* DNI argentino (PDF417): NRO_TRAMITE@APELLIDO@NOMBRE@SEXO@DNI@EJEMPLAR@NACIMIENTO@EMISION... */
function parseDni(txt) {
  const p = txt.split('@').map(s => s.trim());
  if (p.length < 5) return null;
  let dni = p[4];
  if (!/^\d{7,8}$/.test(dni)) dni = (p.slice(3).find(x => /^\d{7,8}$/.test(x))) || '';
  return { apellido: p[1], nombre: p[2], dni };
}

async function arrancar() {
  if (scanner) { try { await scanner.stop(); } catch (e) {} }
  const F = Html5QrcodeSupportedFormats;
  scanner = new Html5Qrcode('reader', {
    formatsToSupport: [modo === 'qr' ? F.QR_CODE : F.PDF_417],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    verbose: false
  });
  // En modo DNI no se usa qrbox: se lee todo el cuadro y el rectángulo de la pantalla es solo una guía visual
  const cfg = modo === 'qr' ? { fps: 10, qrbox: { width: 250, height: 250 } } : { fps: 10 };
  scanner.start({ facingMode: 'environment' }, cfg, txt => {
    if (busy) return; // hay un cartel abierto: no se escanea nada hasta cerrarlo
    if (modo === 'qr') return verificar(txt);
    const d = parseDni(txt);
    if (!d || !d.nombre) return;
    if (d.dni && d.dni === bloqDni.dni && Date.now() < bloqDni.hasta) return;
    navigator.vibrate && navigator.vibrate(80);
    confirmarVenta(d);
  }).catch(e => alert('No se pudo abrir la cámara: ' + e));
}

function limpiarVenta() {
  $('nombre').value = $('dni').value = $('telefono').value = '';
  $('medio').value = '';
}

function cambiarModo(m) {
  modo = m;
  pendiente = null; busy = false;
  clearTimeout(lentoT);
  $('ov').classList.add('hide');
  limpiarVenta();
  $('barTxt').innerHTML = '<b>' + (m === 'qr' ? 'Ingreso con QR' : 'Venta en puerta') + '</b><small>' + esc(FIESTA) + ' · ' + esc(USR) + '</small>';
  $('rw').classList.toggle('dni', m === 'dni');
  $('boxQr').classList.toggle('hide', m !== 'qr');
  $('boxDni').classList.toggle('hide', m !== 'dni');
  arrancar();
}

// ---- Menú de inicio ----
function mostrarHome() {
  if (scanner) { scanner.stop().catch(() => {}); } // apaga la cámara al volver al menú
  busy = false; pendiente = null;
  clearTimeout(lentoT);
  $('ov').classList.add('hide');
  $('app').classList.add('hide');
  $('hdr').classList.remove('hide');
  $('homeTxt').innerHTML = '<span>' + esc(FIESTA) + '</span><span>' + esc(USR) + '</span>';
  $('home').classList.remove('hide');
  $('home').classList.add('fade');
}
function entrarA(m) {
  $('home').classList.add('hide');
  $('hdr').classList.add('hide'); // más lugar para la cámara
  $('app').classList.remove('hide');
  cambiarModo(m);
}
const salir = () => { if (confirm('¿Cerrar sesión para cambiar de usuario o de fiesta?')) location.reload(); };

async function login() {
  audio(); // desbloquea el sonido (el celular lo exige tras un toque)
  FIESTA = $('fiesta').value;
  USR = $('usr').value.trim();
  PIN = $('pin').value.trim();
  const err = $('loginErr'), b = $('btnLogin');
  err.textContent = '';
  if (!FIESTA) { err.textContent = 'Elegí la fiesta'; return; }
  if (!USR || !PIN) { err.textContent = 'Elegí tu usuario y escribí la contraseña'; return; }
  if (!/^\d{4,6}$/.test(PIN)) { err.textContent = 'La contraseña tiene entre 4 y 6 números'; return; }
  b.disabled = true; b.textContent = 'Verificando…';
  try {
    const r = await call({ a: 'stats' });
    if (!r.ok) { err.textContent = 'Usuario o contraseña incorrectos'; return; }
  } catch (e) {
    err.textContent = 'No se pudo conectar: ' + (e && e.message ? e.message : e) + ' (' + TAG() + ')';
    return;
  } finally { b.disabled = false; b.textContent = 'Ingresar'; }
  $('ver').textContent = 'Happy Fest · ' + VERSION + ' · ' + USR + ' · ' + FIESTA;
  $('login').classList.add('hide');
  mostrarHome();
}

let usuariosOk = false;
async function cargarUsuarios() {
  const sel = $('usr'), err = $('loginErr');
  try {
    const r = await call({ a: 'usuarios' });
    if (!r.ok) throw new Error(r.error);
    const lista = (r.usuarios || []).slice().sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
    sel.innerHTML = '<option value="">Elegí tu usuario</option>' + lista.map(u => '<option>' + esc(u) + '</option>').join('');
    usuariosOk = true;
    err.textContent = lista.length ? '' : 'No hay usuarios cargados en la hoja Users';
  } catch (e) {
    sel.innerHTML = '<option value="">No se pudo cargar · tocá para reintentar</option>';
    err.textContent = 'No se pudo cargar la lista de usuarios (' + (e && e.message ? e.message : e) + ')';
  }
}
$('usr').addEventListener('focus', () => { if (!usuariosOk) cargarUsuarios(); });
cargarUsuarios();

$('btnLogin').onclick = login;
$('btnSalir2').onclick = salir;
$('btnHome').onclick = mostrarHome;
$('btnHomeQr').onclick = () => entrarA('qr');
$('btnHomeDni').onclick = () => entrarA('dni');
$('usr').addEventListener('keydown', e => { if (e.key === 'Enter') $('pin').focus(); });
// Al elegir el usuario, pasa directo a la contraseña y abre el teclado numérico
$('usr').addEventListener('change', () => { if ($('usr').value) $('pin').focus(); });
// Solo números en la contraseña
$('pin').addEventListener('input', () => { $('pin').value = $('pin').value.replace(/\D/g, '').slice(0, 6); });
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('btnCodigo').onclick = () => { const c = $('codigo').value; if (busy) return; verificar(c); $('codigo').value = ''; };
$('telefono').addEventListener('input', () => { $('telefono').value = $('telefono').value.replace(/\D/g, ''); });
$('btnVenta').onclick = () => {
  if (busy) return;
  if (!$('nombre').value.trim()) return alert('Falta el nombre');
  if (!$('medio').value) return alert('Elegí el medio de pago');
  audio();
  // Se leen todos los valores ANTES de abrir el cartel de carga
  const nom = $('nombre').value.trim();
  const dniV = $('dni').value;
  const telV = $('telefono').value.replace(/\D/g, '');
  const medioV = $('medio').value;
  cargando('Registrando venta…', nom); // también evita el doble toque; se libera al cerrar el cartel
  seguro(() => call({
    a: 'venta',
    nombre: nom,
    apellido: '',
    dni: dniV,
    telefono: telV,
    medio: medioV
  })).then(r => {
    if (r && r.ok) limpiarVenta();
  });
};
</script>
