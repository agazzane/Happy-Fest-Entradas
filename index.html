<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Fest - Puerta</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#111827;color:#fff}
  main{max-width:480px;margin:0 auto;padding:14px}
  h1{font-size:1.2rem;text-align:center;margin:6px 0 12px}
  input,button{font-size:1.05rem;padding:12px;border-radius:10px;border:0;width:100%;margin-top:8px}
  input{background:#fff;color:#111}
  button{background:#2563eb;color:#fff;font-weight:600}
  button.sec{background:#374151}
  .tabs{display:flex;gap:8px}.tabs button{margin:0}
  .tabs button.on{background:#2563eb}.tabs button:not(.on){background:#374151}
  #reader{width:100%;border-radius:12px;overflow:hidden;margin-top:10px;min-height:120px;background:#000}
  #res{margin-top:10px;padding:22px 14px;border-radius:14px;text-align:center;display:none}
  #res b{display:block;font-size:1.7rem;margin-bottom:6px}
  .ok{background:#16a34a}.warn{background:#d97706}.bad{background:#dc2626}
  #stats{text-align:center;opacity:.8;margin-top:12px}
  .hide{display:none}
</style>
</head>
<body>
<main>
  <h1>Happy Fest - Control de puerta</h1>

  <div id="login">
    <input id="pin" type="password" placeholder="PIN del personal" autocomplete="off">
    <button id="btnLogin">Ingresar</button>
  </div>

  <div id="app" class="hide">
    <div class="tabs">
      <button id="tabQr" class="on">Entradas (QR)</button>
      <button id="tabDni">Venta en puerta (DNI)</button>
    </div>
    <div id="reader"></div>
    <div id="res"></div>

    <div id="boxQr">
      <input id="codigo" placeholder="Código manual (si el QR no lee)" autocapitalize="characters">
      <button id="btnCodigo" class="sec">Verificar código</button>
    </div>

    <div id="boxDni" class="hide">
      <input id="nombre" placeholder="Nombre">
      <input id="apellido" placeholder="Apellido">
      <input id="dni" inputmode="numeric" placeholder="DNI">
      <button id="btnVenta">Registrar venta y dejar ingresar</button>
    </div>
    <div id="stats"></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbyVANuzQ4goyXr99yi3cXZokIM5gJprM9MN2b-K8VGRE5HaRtoU-XKVefXktkIi1tvShw/exec'; // termina en /exec
const $ = id => document.getElementById(id);
let PIN = '', busy = false, scanner = null, modo = 'qr';

async function call(p) {
  const r = await fetch(API + '?' + new URLSearchParams({ ...p, pin: PIN }));
  return r.json();
}

const MSG = {
  VALIDA:       ['ok',   'ENTRADA VÁLIDA'],
  YA_INGRESO:   ['warn', 'YA INGRESÓ'],
  NO_EXISTE:    ['bad',  'NO EXISTE O NO ESTÁ PAGADA'],
  VENTA_OK:     ['ok',   'VENTA REGISTRADA - PUEDE PASAR'],
  DNI_REPETIDO: ['warn', 'ESTE DNI YA FUE REGISTRADO']
};

function show(r) {
  const el = $('res');
  el.style.display = 'block';
  if (!r.ok) { el.className = 'bad'; el.innerHTML = '<b>Error</b>' + r.error; return; }
  const [cls, txt] = MSG[r.estado] || ['bad', 'RESPUESTA INESPERADA: ' + JSON.stringify(r)];
  el.className = cls;
  el.innerHTML = '<b>' + txt + '</b>' + (r.nombre || '') +
    (r.familia ? '<br><small>Invita: ' + r.familia + '</small>' : '') +
    (r.hora ? '<br><small>Hora de ingreso: ' + r.hora + '</small>' : '');
  navigator.vibrate && navigator.vibrate(cls === 'ok' ? 100 : [200, 100, 200]);
  stats();
}

async function seguro(fn) {
  try { show(await fn()); } catch (e) { show({ ok: false, error: 'No se pudo consultar (' + (e && e.message ? e.message : e) + '). Si persiste, usá el Plan B (planilla).' }); }
}

function verificar(code) {
  if (busy || !code) return;
  busy = true;
  seguro(() => call({ a: 'check', c: code.trim() })).finally(() => setTimeout(() => busy = false, 2500));
}

async function stats() {
  try {
    const r = await call({ a: 'stats' });
    if (r.ok) $('stats').textContent = 'Ingresaron ' + r.ingresaron + ' de ' + r.total + ' entradas';
  } catch (e) {}
}

/* DNI argentino (PDF417): NRO_TRAMITE@APELLIDO@NOMBRE@SEXO@DNI@EJEMPLAR@NACIMIENTO@EMISION... */
function parseDni(txt) {
  const p = txt.split('@').map(s => s.trim());
  if (p.length < 5) return null;
  let dni = p[4];
  if (!/^\d{7,8}$/.test(dni)) dni = (p.slice(3).find(x => /^\d{7,8}$/.test(x))) || '';
  return { apellido: p[1], nombre: p[2], dni };
}

async function arrancar() {
  if (scanner) { try { await scanner.stop(); } catch (e) {} }
  const F = Html5QrcodeSupportedFormats;
  scanner = new Html5Qrcode('reader', {
    formatsToSupport: [modo === 'qr' ? F.QR_CODE : F.PDF_417],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    verbose: false
  });
  const box = modo === 'qr' ? { width: 250, height: 250 } : { width: 320, height: 130 };
  scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: box }, txt => {
    if (modo === 'qr') return verificar(txt);
    const d = parseDni(txt);
    if (!d) return;
    $('apellido').value = d.apellido; $('nombre').value = d.nombre; $('dni').value = d.dni;
    navigator.vibrate && navigator.vibrate(80);
  }).catch(e => alert('No se pudo abrir la cámara: ' + e));
}

function cambiarModo(m) {
  modo = m;
  $('tabQr').className = m === 'qr' ? 'on' : '';
  $('tabDni').className = m === 'dni' ? 'on' : '';
  $('boxQr').classList.toggle('hide', m !== 'qr');
  $('boxDni').classList.toggle('hide', m !== 'dni');
  $('res').style.display = 'none';
  arrancar();
}

$('btnLogin').onclick = async () => {
  PIN = $('pin').value.trim();
  try {
    const r = await call({ a: 'stats' });
    if (!r.ok) return alert('PIN incorrecto');
  } catch (e) { return alert('No hay conexión con el servidor'); }
  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  stats(); arrancar();
};
$('tabQr').onclick = () => cambiarModo('qr');
$('tabDni').onclick = () => cambiarModo('dni');
$('btnCodigo').onclick = () => { verificar($('codigo').value); $('codigo').value = ''; };
$('btnVenta').onclick = () => {
  if (!$('nombre').value.trim() && !$('apellido').value.trim()) return alert('Falta el nombre');
  seguro(() => call({ a: 'venta', nombre: $('nombre').value, apellido: $('apellido').value, dni: $('dni').value }))
    .then(() => { $('nombre').value = $('apellido').value = $('dni').value = ''; });
};
</script>
</body>
</html>
